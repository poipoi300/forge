# Durable enforcement of the anti-slop gates. Pre-commit hooks can be bypassed
# with --no-verify; this runs the same checks on every push and PR so nothing
# lands unchecked.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dev tools
        run: uv sync --group dev
      - name: ruff format (check only)
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy .

  tests-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover needs history to compare against main
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dev tools
        run: uv sync --group dev
      - name: Tests + diff coverage
        run: bash tools/coverage_gate.sh
