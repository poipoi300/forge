# forge's own CI: the reusable gates workflow every project calls, run on
# this checkout. forge runs on Ubuntu only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      os: '["ubuntu-24.04"]'
