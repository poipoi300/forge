# forge runner configuration.
#
# A harness is any CLI that takes a prompt and edits the current working
# directory. The runner substitutes {prompt} (inline text) or {prompt_path}
# (path to the .md file) and {telemetry_path} into the command template and
# executes it with the step workspace as cwd.

[runner]
# Which [harness.*] table to use when --harness is not passed.
default_harness = "claude"
# Where per-project run artifacts go (gitignored). Layout:
#   <workspace_root>/<project>/<run_id>/step-NN-<name>/  agent workspace
#   <workspace_root>/<project>/<run_id>/meta/            manifests + logs
workspace_root = "runs"
# Hard ceiling per agent invocation, seconds.
step_timeout_s = 3600

[harness.claude]
command = ["claude", "-p", "{prompt}", "--permission-mode", "acceptEdits", "--output-format", "json"]
telemetry_format = "claude-json"

[harness.pi]
command = ["pi", "--print", "{prompt}"]

[harness.opencode]
command = ["opencode", "run", "{prompt}"]

[requirements]
required = ["uv", "git", "gh"]
optional = ["bun", "cargo", "bwrap"]

[requirements.harness]
claude = { cli = "claude" }
pi = { cli = "pi" }
opencode = { cli = "opencode" }

[requirements.gate]
trailing-whitespace = { required = ["uv"] }
end-of-file-fixer = { required = ["uv"] }
check-merge-conflict = { required = ["uv"] }
check-case-conflict = { required = ["git", "uv"] }
check-added-large-files = { required = ["uv"] }
check-yaml = { required = ["uv"] }
check-toml = { required = ["uv"] }
check-json = { required = ["uv"] }
debug-statements = { required = ["uv"] }
detect-private-key = { required = ["uv"] }
no-todo = { required = ["uv"] }
ruff-format = { required = ["uv"] }
ruff-check = { required = ["uv"] }
mypy = { required = ["uv"] }
tests-and-diff-coverage = { required = ["git", "uv"] }
# Scanner gates are planned. Their tools are advisory until those gates land.
gitleaks = { optional = ["gitleaks"] }
osv-scanner = { optional = ["osv-scanner"] }
semgrep = { optional = ["semgrep"] }
