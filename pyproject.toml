[project]
name = "forge"
version = "0.1.0"
description = "A project-lifecycle system: spec intake, repo generation, and quality gates that tighten over time"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
forge = "forge.cli:main"
forge-hygiene = "forge.hooks.hygiene:main"
forge-todo-gate = "forge.hooks.todo:main"
forge-coverage-gate = "forge.hooks.coverage:main"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "forge"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "coverage>=7.6",
    "diff-cover>=9.2",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",       # imports
    "UP",      # outdated constructs
    "B",       # likely bugs
    "SIM",     # needless complexity
    "C4",      # unnecessary comprehensions
    "RET",     # confused returns
    "ARG",     # unused arguments
    "PTH",     # pathlib consistency
    "PERF",    # obvious performance mistakes
    "RUF",
    "PGH",     # blanket noqa / type: ignore without a code
    "ISC",     # implicit string concatenation
    "PIE",     # misc slop (duplicate class fields, pointless placeholders)
    "ERA",     # commented-out code
]
ignore = [
    "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures and mocks take arguments they don't always use.
"test/**" = ["ARG"]

[tool.mypy]
strict = true
explicit_package_bases = true
ignore_missing_imports = true
exclude = ['^\.venv/']

[tool.coverage.run]
branch = true
relative_files = true
source = ["src"]

[tool.coverage.report]
include_namespace_packages = true
